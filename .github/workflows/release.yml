name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 4.0.0)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        cd familyos_ultrabert
        python -m build

    - name: Verify package contents
      run: |
        cd familyos_ultrabert
        echo "Package contents:"
        tar -tzf dist/*.tar.gz | head -20
        echo "---"
        unzip -l dist/*.whl | head -20

    - name: Publish to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: familyos_ultrabert/dist/
        print-hash: true

    - name: Upload release assets
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: familyos_ultrabert/dist/familyos_ultrabert-${{ github.event.release.tag_name }}-py3-none-any.whl
        asset_name: familyos-ultrabert-${{ github.event.release.tag_name }}-py3-none-any.whl
        asset_content_type: application/zip

    - name: Upload source distribution
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: familyos_ultrabert/dist/familyos-ultrabert-${{ github.event.release.tag_name }}.tar.gz
        asset_name: familyos-ultrabert-${{ github.event.release.tag_name }}.tar.gz
        asset_content_type: application/gzip
