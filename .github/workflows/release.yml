name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 4.0.0)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build release artifacts
        run: |
          python scripts/prepare_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --test-install \
            --generate-checksums \
            --write-release-summary \
            --build-bundle

      - name: Verify package contents
        shell: bash
        run: |
          echo "Package contents:"
          tar -tzf familyos_ultrabert/dist/*.tar.gz | head -20
          echo "---"
          unzip -l familyos_ultrabert/dist/*.whl | head -20

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: familyos-ultrabert-${{ steps.version.outputs.version }}
          path: familyos_ultrabert/dist/*

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: familyos_ultrabert/dist/
          print-hash: true

      - name: Upload GitHub release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyos_ultrabert/dist/*.whl
            familyos_ultrabert/dist/*.tar.gz
            familyos_ultrabert/dist/SHA256SUMS.txt
            familyos_ultrabert/dist/RELEASE_${{ steps.version.outputs.version }}.md
            familyos_ultrabert/dist/familyos_ultrabert-${{ steps.version.outputs.version }}-release.zip
