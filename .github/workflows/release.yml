name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 4.0.0)'
        required: true
        type: string
      publish_to_pypi:
        description: 'Publish built artifacts to PyPI as part of this manual run'
        required: false
        default: false
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build release artifacts
        run: |
          python scripts/prepare_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --test-install \
            --generate-checksums \
            --write-release-summary \
            --build-bundle

      - name: Verify package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("familyos_ultrabert/dist")
          sdist = next(dist.glob("*.tar.gz"))
          wheel = next(dist.glob("*.whl"))

          print("Package contents:")
          with tarfile.open(sdist, "r:gz") as tf:
              for member in tf.getnames()[:20]:
                  print(member)

          print("---")
          with zipfile.ZipFile(wheel) as zf:
              for member in zf.namelist()[:20]:
                  print(member)
          PY

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: familyos-ultrabert-${{ steps.version.outputs.version }}
          path: familyos_ultrabert/dist/*

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.event.inputs.publish_to_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: familyos_ultrabert/dist/
          print-hash: true

      - name: Upload GitHub release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyos_ultrabert/dist/*.whl
            familyos_ultrabert/dist/*.tar.gz
            familyos_ultrabert/dist/SHA256SUMS.txt
            familyos_ultrabert/dist/RELEASE_${{ steps.version.outputs.version }}.md
            familyos_ultrabert/dist/familyos_ultrabert-${{ steps.version.outputs.version }}-release.zip
