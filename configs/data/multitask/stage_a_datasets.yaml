# Stage A: Public Datasets Configuration
# Datasets for generic multi-task training

datasets:
  # ============================================
  # NER - General Named Entity Recognition
  # ============================================
  ner_conll2003:
    task: ner_general
    source: huggingface
    name: conll2003
    splits:
      train: train
      validation: validation
      test: test
    column_mapping:
      tokens: tokens
      labels: ner_tags
    label_map:
      O: 0
      B-PER: 1
      I-PER: 2
      B-ORG: 3
      I-ORG: 4
      B-LOC: 5
      I-LOC: 6
      B-MISC: 7
      I-MISC: 8

  # WikiNeural English - 92K samples! Uses tner/wikineural which works properly
  ner_wikineural:
    task: ner_general
    source: huggingface
    name: tner/wikineural
    config: en  # English config - required!
    enabled: true
    splits:
      train: train
      validation: validation
      test: test
    column_mapping:
      tokens: tokens
      labels: tags  # tner uses 'tags' not 'ner_tags'
    # WikiNeural uses same 0-8 indices as CoNLL - no remapping needed
    label_map:
      O: 0
      B-PER: 1
      I-PER: 2
      B-ORG: 3
      I-ORG: 4
      B-LOC: 5
      I-LOC: 6
      B-MISC: 7
      I-MISC: 8

  # Few-NERD - 132K samples with EVENT labels!
  # NOTE: DISABLED - Few-NERD uses flat labels (not BIO format)
  # Would need conversion: consecutive 'person' tags need B-PER/I-PER
  # Coarse labels: O, art, building, event, location, organization, other, person, product
  ner_fewnerd:
    task: ner_general
    source: huggingface
    name: DFKI-SLT/few-nerd
    config: supervised
    enabled: false  # DISABLED: Not BIO format, needs conversion

  ner_ontonotes:
    task: ner_general
    source: huggingface
    name: tner/ontonotes5
    enabled: false  # Requires script loading
    splits:
      train: train
      validation: validation
      test: test

  # ============================================
  # Sentiment Classification
  # ============================================
  sentiment_sst2:
    task: sentiment
    source: huggingface
    name: stanfordnlp/sst2
    splits:
      train: train
      validation: validation
    column_mapping:
      text: sentence
      label: label
    # SST-2 is binary (0=neg, 1=pos), maps to 5-class (1=neg, 3=pos)

  # DynaSent - excellent source of NEUTRAL samples (45K neutral!)
  sentiment_dynasent:
    task: sentiment
    source: huggingface
    name: dynabench/dynasent
    config: dynabench.dynasent.r1.all
    enabled: true
    splits:
      train: train
      validation: validation
    column_mapping:
      text: sentence
      label: gold_label
    # DynaSent has 3-class: negative, neutral, positive
    # Maps to: negative->1, neutral->2, positive->3

  # Yelp Review Full - 5-star ratings for EXTREME samples (very_negative, very_positive)
  sentiment_yelp_full:
    task: sentiment
    source: huggingface
    name: yelp_review_full
    enabled: true
    max_samples: 100000  # Sample 100K from 650K (balanced 20K per class)
    splits:
      train: train
      validation: test  # Uses test as validation
    column_mapping:
      text: text
      label: label
    # Yelp 5-star: 0=1star->very_neg(0), 1=2star->neg(1), 2=3star->neutral(2), 3=4star->pos(3), 4=5star->very_pos(4)

  sentiment_amazon:
    task: sentiment
    source: huggingface
    name: amazon_polarity
    enabled: false  # Disabled - using Yelp Full instead (has all 5 classes)
    max_samples: 100000

  # ============================================
  # Emotion Detection
  # ============================================
  emotions_goemotions:
    task: emotions
    source: huggingface
    name: google-research-datasets/go_emotions
    config: simplified  # 28 -> 12 labels
    splits:
      train: train
      validation: validation
      test: test
    column_mapping:
      text: text
      label: labels
    enabled: false  # Replaced by FamilyOS emotions dataset
    # Reduced label set (12 emotions)
    label_map:
      admiration: 0
      amusement: 1
      anger: 2
      annoyance: 3
      approval: 4
      caring: 5
      confusion: 6
      curiosity: 7
      desire: 8
      disappointment: 9
      disapproval: 10
      disgust: 11
      # ... mapped from 28 -> 12

  emotions_familyos_silver:
    task: emotions
    source: local
    name: data/familyos/emotions/silver
    label_schema: emotions_familyos
    format: jsonl
    enabled: false  # Disabled for Stage A - use super-labels version below
    splits:
      train: train

  # Stage A: Super-labels (7 classes) for curriculum learning
  # Pre-consolidated from 44 granular emotions - see scripts/consolidate_labels.py
  emotions_super:
    task: emotions
    source: local
    name: data/familyos/emotions/silver_super
    label_schema: emotions_super
    format: jsonl
    splits:
      train: train

  emotions_familyos_gold:
    task: emotions
    source: local
    name: data/familyos/emotions/gold
    label_schema: emotions_familyos
    format: jsonl
    splits:
      train: train
      validation: validation

  # ============================================
  # Safety / Toxicity Detection
  # ============================================
  safety_jigsaw:
    task: safety_generic
    source: huggingface
    name: jigsaw_toxicity_pred
    enabled: false  # Requires manual Kaggle download
    splits:
      train: train
      validation: validation
    column_mapping:
      text: comment_text
      labels:
        - toxic
        - severe_toxic
        - obscene
        - threat
        - insult
        - identity_hate

  # Original Civil Comments from HuggingFace (extreme class imbalance - severe_toxic: 0.03%)
  safety_civil_comments:
    task: safety_generic
    source: huggingface
    name: civil_comments
    enabled: false  # DISABLED: Use curated version instead (balanced classes)
    max_samples: 200000
    column_mapping:
      text: text
      label: toxicity

  # Curated Civil Comments with balanced classes (see data/public/civil_comments_curated/README.md)
  # severe_toxic: 0.03% -> 1.47%, threat: 0.76% -> 7.13%, etc.
  safety_civil_comments_curated:
    task: safety_generic
    source: local
    data_dir: data/public/civil_comments_curated
    format: jsonl
    enabled: true
    splits:
      train: train
      validation: validation
    column_mapping:
      text: text
      labels: labels  # Pre-computed multi-hot [8] for toxic,severe,obscene,threat,insult,identity,self_harm,dangerous
    # Labels already multi-hot encoded, no schema needed

  # ============================================
  # Natural Language Inference
  # ============================================
  nli_mnli:
    task: nli
    source: huggingface
    name: multi_nli
    splits:
      train: train
      validation: validation_matched
    column_mapping:
      premise: premise
      hypothesis: hypothesis
      label: label

  nli_anli:
    task: nli
    source: huggingface
    name: anli
    enabled: false  # Harder adversarial NLI
    splits:
      train: train_r1
      validation: dev_r1

  nli_snli:
    task: nli
    source: huggingface
    name: stanfordnlp/snli
    splits:
      train: train
      validation: validation

  # ============================================
  # Embeddings / Contrastive Learning
  # ============================================
  embedding_stsb:
    task: embedding
    source: huggingface
    name: sentence-transformers/stsb
    config: default
    loss_type: pairs  # Format for loader: pairs or triplets
    splits:
      train: train
      validation: validation
      test: test
    column_mapping:
      sentence1: sentence1
      sentence2: sentence2
      score: score  # 0-5 similarity

  embedding_nli_pairs:
    task: embedding
    source: huggingface
    name: sentence-transformers/all-nli
    config: pair-score  # Required: pick from ['pair', 'pair-class', 'pair-score', 'triplet']
    loss_type: pairs  # Format for loader: pairs or triplets
    splits:
      train: train
      validation: dev  # Uses 'dev' split, not 'validation'
      test: test
    column_mapping:
      anchor: anchor
      positive: positive
      # Negatives sampled in-batch

  # ============================================
  # Temporal Expression Recognition
  # ============================================
  temporal_familyos_silver:
    task: temporal
    source: local
    data_dir: data/familyos/temporal/silver
    format: jsonl
    enabled: true
    splits:
      train: train  # Main silver training data
    column_mapping:
      tokens: tokens
      labels: temporal_tags
    # 13 BIO tags for 6 temporal entity types
    label_map:
      O: 0
      B-DATE_ABS: 1
      I-DATE_ABS: 2
      B-DATE_REL: 3
      I-DATE_REL: 4
      B-TIME: 5
      I-TIME: 6
      B-DURATION: 7
      I-DURATION: 8
      B-FREQUENCY: 9
      I-FREQUENCY: 10
      B-AGE: 11
      I-AGE: 12

  temporal_familyos_gold:
    task: temporal
    source: local
    data_dir: data/familyos/temporal/gold
    format: jsonl
    enabled: true
    splits:
      train: train
      validation: validation
    column_mapping:
      tokens: tokens
      labels: temporal_tags

# Global preprocessing
preprocessing:
  max_length: 512
  truncation: true
  padding: false  # Dynamic padding in collator

# Data mixing strategy
mixing:
  strategy: temperature  # CHANGED: temperature sampling for balanced training
  temperature: 2.0  # Higher = more uniform sampling across tasks
  shuffle_seed: 42
