# Stage A: A100-80GB Hyperfast Configuration (V2.1 CALIBRATED)
#
# VERIFIED FIXES:
# 1. NER SCHEMA: num_labels 17 (Fixes data poisoning/clipping in loaders.py)
# 2. UNCERTAINTY WEIGHTING: Enabled to balance tasks dynamically
# 3. SAFETY CALIBRATION: Removed pos_weight, reduced gamma_neg to 2.0 (Fixes Precision collapse)
# 4. EMBEDDING STABILITY: Reduced hard negatives to 7
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_a100_fast_v2_1.yaml

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16
  use_flash_attention_2: true

# Multi-task head configuration
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 17  # FIXED: Matches labels.py (0-16) to prevent clipping
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5
    dropout: 0.1
    label_smoothing: 0.1

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 44
    problem_type: multi_label_classification
    dropout: 0.1
    use_asl: true
    # CALIBRATION FIX: Relaxed suppression
    asl_gamma_neg: 2.0          # Reduced from 4.0
    asl_gamma_pos: 1.0
    asl_clip: 0.05
    # pos_weight removed to prevent over-recall
    use_hierarchical_loss: true
    use_label_correlation: true
    use_dynamic_thresholds: true
    label_smoothing: 0.05

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8
    problem_type: multi_label_classification
    dropout: 0.1
    use_asl: true
    # CALIBRATION FIX: Relaxed suppression
    asl_gamma_neg: 2.0          # Reduced from 4.0
    asl_gamma_pos: 1.0
    asl_clip: 0.05
    # pos_weight removed - loaders.py 0.3 threshold provides enough recall signal

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3
    dropout: 0.1
    label_smoothing: 0.1

  embedding:
    enabled: true
    type: embedding
    pooling: mean
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13
    dropout: 0.1

# Task LOSS weights
# Reset to 1.0 because uncertainty weighting handles the scaling
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.0
  safety_generic: 1.0
  nli: 1.0
  embedding: 1.0
  temporal: 1.0

# Data mixing
mixing:
  strategy: temperature
  temperature: 2.0
  shuffle_seed: 42

# Head-wise optimizer configuration
optimizer:
  encoder_lr: 2e-5
  head_lr: 1e-4
  token_head_lr: 5e-5
  layer_decay: 0.95

# Training configuration
training:
  per_device_train_batch_size: 192
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 2

  learning_rate: 2e-5
  num_train_epochs: 10
  
  # === V2.1 CRITICAL: ENABLE UNCERTAINTY WEIGHTING ===
  use_uncertainty_weighting: true 

  use_ema: true
  ema_decay: 0.999

  # Reduced hard negatives to stabilize embedding loss initially
  embedding_hard_negatives: 7

  label_smoothing: 0.1

  # Progressive Regularization
  progressive_regularization: true
  rdrop_start_epoch: 4
  mixup_start_epoch: 4
  adversarial_start_epoch: 8

  use_rdrop: true
  rdrop_alpha: 0.7

  use_adversarial: true
  adversarial_type: fgm
  adversarial_epsilon: 1.0

  use_mixup: true
  mixup_alpha: 0.4
  mixup_prob: 0.6

  gradient_checkpointing: false
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  lr_scheduler_type: cosine
  warmup_ratio: 0.06

  bf16: true
  fp16: false

  eval_strategy: steps
  eval_steps: 1500
  save_strategy: steps
  save_steps: 1500
  save_total_limit: 4
  load_best_model_at_end: true
  metric_for_best_model: eval_weighted_avg_score
  greater_is_better: true

  logging_steps: 50
  report_to:
    - tensorboard

  seed: 42
  data_seed: 42

  dataloader_num_workers: 12
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true

output:
  output_dir: outputs/modernbert-multitask-v2-1-calibrated
  checkpoint_dir: checkpoints/modernbert-multitask-v2-1-calibrated
  logging_dir: outputs/modernbert-multitask-v2-1-calibrated/logs

data_config: configs/data/multitask/stage_a_datasets.yaml
