# Stage A: A100-80GB Hyperfast Configuration (V2 COMPLIANT)
# For A100-80GB GPUs (Colab A100 High-RAM, GCP a2-highgpu)
# Goal: Max throughput + V2 compliance
#
# V2 COMPLIANCE CHECKLIST:
# ✅ 10 epochs - "DO NOT SKIP THESE PHASES"
# ✅ Head-wise learning rates (encoder_lr, head_lr, token_head_lr)
# ✅ EMA model (use_ema: true, ema_decay: 0.999)
# ✅ Embedding hard negatives (15)
# ✅ Task weights per v2 spec (emotions: 1.5, safety: 2.0, embedding: 0.5)
# ❌ Uncertainty weighting DISABLED
# ✅ Temperature sampling (higher temp=4 for speed)
# ✅ Layer decay (0.95)
# ✅ Warmup ratio 0.1
# ✅ Flash Attention 2 for speed (requires flash-attn package)
# ✅ No gradient checkpointing for max speed
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_a100_fast.yaml

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16            # A100 native precision
  use_flash_attention_2: true      # Turn OFF if you see NaNs / crashes or flash-attn not installed

# Multi-task head configuration (7 generic heads for Stage A)
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 9  # O, B/I-PER, B/I-ORG, B/I-LOC, B/I-MISC
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5
    dropout: 0.1
    label_smoothing: 0.1       # Regularization for single-label classification

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 44
    problem_type: multi_label_classification
    dropout: 0.1
    # ASL (Asymmetric Loss) - SOTA for multi-label, better than focal loss
    use_asl: true
    asl_gamma_neg: 4.0          # Suppress easy negatives (higher = more suppression)
    asl_gamma_pos: 1.0          # Keep positives learning (lower = less suppression)
    asl_clip: 0.05              # Shift negative probs down by 0.05
    pos_weight: 2.0             # Additional positive upweighting
    # SOTA HierarchicalEmotionHead enhancements
    use_hierarchical_loss: true   # Family coherence regularization
    use_label_correlation: true   # GCN-style emotion co-occurrence
    use_emotion_attention: true   # Multi-head attention over sequence (more compute, better results)
    use_dynamic_thresholds: true  # Learnable per-emotion thresholds
    use_mixup: true               # Latent space data augmentation
    label_smoothing: 0.05         # Regularization

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8
    problem_type: multi_label_classification
    dropout: 0.1
    # ASL (Asymmetric Loss) - SOTA for multi-label, better than focal loss
    use_asl: true
    asl_gamma_neg: 4.0          # Suppress easy negatives
    asl_gamma_pos: 0.0          # No suppression on positives (rare, want full gradient)
    asl_clip: 0.05              # Shift negative probs down
    # Per-class pos_weight: [toxic, severe_toxic, obscene, threat, insult, identity_hate, self_harm, dangerous_advice]
    # Frequencies: ~6%, ~0.3%, ~2%, ~0.2%, ~4%, ~0.5%, ~1%, ~1%
    pos_weight: [3.0, 30.0, 6.0, 50.0, 5.0, 30.0, 20.0, 20.0]  # Reduced since ASL helps

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3
    dropout: 0.1
    label_smoothing: 0.1       # Regularization for single-label classification

  embedding:
    enabled: true
    type: embedding
    pooling: mean
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13
    dropout: 0.1

# Task LOSS weights - V2 SPEC (emphasize safety + emotions, reduce embedding)
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.5       # Emphasize emotions per v2 plan (was 1.0)
  safety_generic: 2.0 # Emphasize safety per v2 plan (was 1.0)
  nli: 1.0
  embedding: 0.5      # Reduce embedding dominance per v2 plan
  temporal: 1.0

# Data mixing - higher temperature for faster uniform sampling
mixing:
  strategy: temperature
  temperature: 4.0       # Higher temp = more uniform (faster convergence on small tasks)
  shuffle_seed: 42

# Head-wise optimizer configuration - V2 SPEC
optimizer:
  encoder_lr: 2e-5       # Lower LR for pretrained encoder
  head_lr: 1e-4          # Higher LR for classification heads
  token_head_lr: 5e-5    # Medium LR for token classification heads (NER, temporal)
  layer_decay: 0.95      # Gradual LR decay from top to bottom layers

# A100-80GB HYPERFAST training - V2 COMPLIANT
training:
  # === BATCH & SPEED (optimized for A100-80GB) ===
  per_device_train_batch_size: 384  # Max batch for 80GB (FGM/R-Drop OFF)
  per_device_eval_batch_size: 384
  gradient_accumulation_steps: 2      # Effective batch = 256

  # === LEARNING RATE (base, overridden by optimizer section for heads) ===
  learning_rate: 2e-5

  # === TRAINING DURATION - V2 SPEC: 10-12 EPOCHS ===
  num_train_epochs: 10
  max_steps: -1

  # === EMA MODEL - V2 SPEC ===
  use_ema: true
  ema_decay: 0.999

  # === UNCERTAINTY WEIGHTING - V2 SPEC ===
  use_uncertainty_weighting: false  # DISABLED

  # === EMBEDDING HARD NEGATIVES - V2 SPEC ===
  embedding_hard_negatives: 23

  # === SOTA TECHNIQUES ===
  # Label Smoothing: Reduces overconfidence, improves calibration (+0.5-1% acc)
  label_smoothing: 0.1

  # R-Drop: Consistency regularization via dropout variations (+1-2% NLU)
  use_rdrop: false            # DISABLED for speed (saves ~40% time)
  rdrop_alpha: 0.7            # KL divergence weight (unused when disabled)

  # Adversarial Training: FGM/PGD for robustness (+0.5-1.5% on hard examples)
  use_adversarial: true      # DISABLED for 1st run (saves VRAM + 30% time)
  adversarial_type: fgm       # 'fgm' (faster) or 'pgd' (stronger)
  adversarial_epsilon: 1.0    # Perturbation magnitude
  pgd_steps: 3                # Only for PGD
  pgd_alpha: 0.3              # Only for PGD

  # Mixup: Embedding-space augmentation for smoother decision boundaries
  use_mixup: true             # ENABLED: Embedding-space mixup
  mixup_alpha: 0.4            # Beta distribution parameter
  mixup_prob: 0.8             # Probability of applying mixup to batch

  # === MEMORY: NO CHECKPOINTING FOR SPEED (High-RAM A100) ===
  gradient_checkpointing: false

  # === OPTIMIZER ===
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  # === SCHEDULE - V2 SPEC ===
  lr_scheduler_type: cosine
  warmup_ratio: 0.06  # V2 spec warmup

  # === PRECISION ===
  bf16: true
  fp16: false

  # === EVALUATION & CHECKPOINTING (less frequent for speed) ===
  eval_strategy: steps
  eval_steps: 2000
  save_strategy: steps
  save_steps: 2000
  save_total_limit: 6
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_score
  greater_is_better: true

  # === LOGGING ===
  logging_steps: 100
  report_to:
    - tensorboard

  # === REPRODUCIBILITY ===
  seed: 42
  data_seed: 42

  # === DATA LOADING (tuned for big GCE box) ===
  dataloader_num_workers: 12
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true  # +25-45% throughput: workers survive epochs

# Output
output:
  output_dir: outputs/modernbert-multitask-v0-stage-a-fast
  checkpoint_dir: checkpoints/modernbert-multitask-v0-stage-a-fast
  logging_dir: outputs/modernbert-multitask-v0-stage-a-fast/logs

# Data config
data_config: configs/data/multitask/stage_a_datasets.yaml
