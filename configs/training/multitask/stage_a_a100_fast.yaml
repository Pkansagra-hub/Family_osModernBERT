# Stage A: A100-80GB Hyperfast Configuration (V2 COMPLIANT)
# For A100-80GB GPUs (Colab A100 High-RAM, GCP a2-highgpu)
# Goal: Max throughput + V2 compliance
#
# V2 COMPLIANCE CHECKLIST:
# ✅ 10 epochs - "DO NOT SKIP THESE PHASES"
# ✅ Head-wise learning rates (encoder_lr, head_lr, token_head_lr)
# ✅ EMA model (use_ema: true, ema_decay: 0.999)
# ✅ Embedding hard negatives (23 for better contrastive learning)
# ✅ Task weights per v2 spec (emotions: 1.5, safety: 2.0, embedding: 0.5)
# ❌ Uncertainty weighting DISABLED
# ✅ Temperature sampling (higher temp=4 for speed)
# ✅ Layer decay (0.95)
# ✅ Warmup ratio 0.1
# ✅ Flash Attention 2 for speed (requires flash-attn package)
# ✅ No gradient checkpointing for max speed
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_a100_fast.yaml

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16            # A100 native precision
  use_flash_attention_2: true      # Turn OFF if you see NaNs / crashes or flash-attn not installed

# Multi-task head configuration (7 generic heads for Stage A)
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 9  # O, B/I-PER, B/I-ORG, B/I-LOC, B/I-MISC
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5
    dropout: 0.1
    label_smoothing: 0.1       # Regularization for single-label classification

  emotions:
    enabled: true
    type: sequence_classification
    # Stage A: 7 Primary Super-Labels (Hybrid Strategy)
    # We predict the ONE primary emotional theme per sentence
    num_labels: 7
    problem_type: single_label_classification  # CrossEntropy (not BCE)
    dropout: 0.1
    label_smoothing: 0.1       # Helps generalization/calibration

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8
    problem_type: multi_label_classification
    dropout: 0.1
    # ASL (Asymmetric Loss) - SOTA for multi-label, better than focal loss
    use_asl: true
    asl_gamma_neg: 4.0          # Suppress easy negatives
    asl_gamma_pos: 1.0          # Standard (data is balanced now)
    asl_clip: 0.05              # Shift negative probs down
    # Per-class pos_weight for CURATED Safety Dataset (Civil Comments + Suicide + BeaverTails):
    # Distribution: toxic=73.6%, severe_toxic=14.9%, obscene=10.3%, threat=14.3%,
    #               insult=17.8%, identity_hate=11.0%, sexually_explicit=10.9%, profanity=12.7%
    # pos_weight = 100 / percentage (inverse frequency)
    pos_weight: [1.4, 6.7, 9.7, 7.0, 5.6, 9.1, 9.2, 7.9]

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3
    dropout: 0.1
    label_smoothing: 0.1       # Regularization for single-label classification

  embedding:
    enabled: true
    type: embedding
    pooling: mean
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13
    dropout: 0.1

# Task LOSS weights - V2 SPEC (emphasize safety + emotions, reduce embedding)
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.5       # Emphasize emotions per v2 plan (was 1.0)
  safety_generic: 2.0 # Emphasize safety per v2 plan (was 1.0)
  nli: 1.0
  embedding: 0.5      # Reduce embedding dominance per v2 plan
  temporal: 1.0

# Data mixing - higher temperature for faster uniform sampling
mixing:
  strategy: temperature
  temperature: 4.0       # Higher temp = more uniform (faster convergence on small tasks)
  shuffle_seed: 42

# Head-wise optimizer configuration - V2 SPEC
optimizer:
  encoder_lr: 2e-5       # Lower LR for pretrained encoder
  head_lr: 1e-4          # Higher LR for classification heads
  token_head_lr: 5e-5    # Medium LR for token classification heads (NER, temporal)
  layer_decay: 0.95      # Gradual LR decay from top to bottom layers

# A100-80GB HYPERFAST training - V2 COMPLIANT
training:
  # === BATCH & SPEED (optimized for A100-80GB) ===
  per_device_train_batch_size: 128  # Max batch for 80GB (FGM/R-Drop OFF)
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 2    # Effective batch = 256

  # === LEARNING RATE (base, overridden by optimizer section for heads) ===
  learning_rate: 2e-5

  # === TRAINING DURATION ===
  # 3-4 epochs is sufficient for Stage A with plain BCE loss
  # More epochs risk overfitting without benefit
  num_train_epochs: 4
  max_steps: -1

  # === EMA MODEL - V2 SPEC ===
  use_ema: true
  ema_decay: 0.999

  # === UNCERTAINTY WEIGHTING - V2 SPEC ===
  use_uncertainty_weighting: false  # DISABLED

  # === EMBEDDING HARD NEGATIVES - V2 SPEC ===
  embedding_hard_negatives: 23

  # === SOTA TECHNIQUES ===
  # Label Smoothing: Reduces overconfidence, improves calibration (+0.5-1% acc)
  label_smoothing: 0.1

  # === PROGRESSIVE REGULARIZATION ===
  # DISABLED for 3-epoch training - not enough epochs to benefit
  # Keep training simple: plain BCE, no extra regularization tricks
  progressive_regularization: false
  rdrop_start_epoch: 2        # Not used when progressive_regularization=false
  mixup_start_epoch: 2        # Not used when progressive_regularization=false
  adversarial_start_epoch: 3  # Not used when progressive_regularization=false

  # R-Drop: DISABLED - adds complexity without benefit for short training
  use_rdrop: false
  rdrop_alpha: 0.7

  # Adversarial Training: DISABLED - adds complexity without benefit for short training
  use_adversarial: false
  adversarial_type: fgm
  adversarial_epsilon: 1.0
  pgd_steps: 3
  pgd_alpha: 0.3

  # Mixup: DISABLED - adds complexity without benefit for short training
  use_mixup: false
  mixup_alpha: 0.4
  mixup_prob: 0.8

  # === MEMORY: NO CHECKPOINTING FOR SPEED (High-RAM A100) ===
  gradient_checkpointing: false

  # === OPTIMIZER ===
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  # === SCHEDULE - V2 SPEC ===
  lr_scheduler_type: cosine
  warmup_ratio: 0.06  # V2 spec warmup

  # === PRECISION ===
  bf16: true
  fp16: false

  # === EVALUATION & CHECKPOINTING (less frequent for speed) ===
  eval_strategy: steps
  eval_steps: 1500
  save_strategy: steps
  save_steps: 1500
  save_total_limit: 6
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_score
  greater_is_better: true

  # === LOGGING ===
  logging_steps: 100
  report_to:
    - tensorboard
    # - wandb  # Disabled to avoid login prompts - enable after `wandb login`

  # === W&B CONFIG ===
  # To enable W&B logging:
  # 1. Run: wandb login
  # 2. Uncomment 'wandb' in report_to above
  # Set WANDB_PROJECT env var or it defaults to "huggingface"

  # === REPRODUCIBILITY ===
  seed: 42
  data_seed: 42

  # === DATA LOADING (tuned for big GCE box) ===
  dataloader_num_workers: 12
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true  # +25-45% throughput: workers survive epochs

# Output
output:
  output_dir: outputs/modernbert-multitask-v0-stage-a-fast
  checkpoint_dir: checkpoints/modernbert-multitask-v0-stage-a-fast
  logging_dir: outputs/modernbert-multitask-v0-stage-a-fast/logs

# Data config
data_config: configs/data/multitask/stage_a_datasets.yaml
