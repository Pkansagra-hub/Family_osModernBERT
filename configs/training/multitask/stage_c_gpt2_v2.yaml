# =============================================================================
# Stage C v2: Continued Fine-tuning for Subdomain Rebalancing
# =============================================================================
# PURPOSE: Second fine-tune of GPT-2 decoder with balanced subdomain data.
#          Loads already fine-tuned ultrabert-gen-decoder-v1 checkpoint.
#          Trains for 2-3 epochs on rebalanced dataset to fix weak subdomains.
#
# Input: ultrabert-gen-decoder-v1 (first fine-tuned checkpoint)
# Output: ultrabert-gen-decoder-v2 (rebalanced model)
#
# Key Differences from v1:
#   - Loads FROM v1 checkpoint (not from modernbert-v2-for-v3-transfer)
#   - Lower learning rate (prevent catastrophic forgetting)
#   - Fewer epochs (2-3 instead of 7)
#   - Uses balanced_training.jsonl with equal subdomain representation
#
# Data Strategy (Anti-Forgetting):
#   - New synthetic data for underrepresented subdomains
#   - Sample from original merged data for well-represented domains
#   - Target: ~1000 samples per subdomain, ~86K total
#
# Usage:
#   python scripts/train_stage_c.py --config configs/training/multitask/stage_c_gpt2_v2.yaml
# =============================================================================

# =============================================================================
# Base Model (Load from v1 fine-tuned checkpoint)
# =============================================================================
model:
  # Load the ALREADY FINE-TUNED v1 checkpoint (not the base model!)
  checkpoint_path: "outputs/ultrabert-gen-decoder-v1"

  # Freezing strategy - same as v1
  freeze_encoder: true         # Encoder stays frozen
  freeze_existing_heads: true  # Keep 12 heads frozen

  torch_dtype: bfloat16
  use_flash_attention_2: true

# =============================================================================
# Decoder Configuration (Same as v1)
# =============================================================================
decoder:
  type: "gpt2"
  gpt2_model_name: "gpt2-medium"

  projection_hidden_size: 1024
  prefix_projection_layers: 1
  use_prefix_injection: true

  # Train all layers for adaptation
  freeze_layers: 0

  max_position_embeddings: 512
  vocab_size: 50368

  pad_token_id: 50283
  bos_token_id: 50281
  eos_token_id: 50282

  dropout: 0.1

  generation_max_length: 128
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2

# =============================================================================
# Data Configuration (Balanced Training Data)
# =============================================================================
data:
  # Training data - BALANCED dataset with equal subdomain representation
  # This is generated by prepare_balanced_training_data.py
  train_path: "data/counterfactual/training_v2"

  embeddings_mode: "precomputed"
  full_sequence: true

  max_input_length: 256
  max_output_length: 256

  num_workers: 8
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  load_to_ram: true

# =============================================================================
# Training Configuration (Lower LR, Fewer Epochs)
# =============================================================================
training:
  output_dir: "outputs/ultrabert-gen-decoder-v2"
  checkpoint_dir: "checkpoints/ultrabert-gen-decoder-v2"

  # FEWER EPOCHS - model is already fine-tuned
  num_train_epochs: 3
  max_steps: -1

  # Batch size - same as v1
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 2

  # LOWER LEARNING RATE - prevent catastrophic forgetting
  learning_rate: 3.0e-5         # 3x lower than v1 (was 1e-4)
  weight_decay: 0.01
  max_grad_norm: 1.0

  # LR schedule - cosine with longer warmup
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1             # 10% warmup (double v1)

  optim: "adamw_torch_fused"

  bf16: true
  fp16: false

  gradient_checkpointing: false
  dataloader_pin_memory: true
  torch_compile: false
  tf32: true

  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 3
  save_safetensors: true

  eval_strategy: "steps"
  eval_steps: 250

  logging_strategy: "steps"
  logging_steps: 10
  logging_first_step: true

  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  report_to:
    - "tensorboard"

  seed: 42

  dataloader_num_workers: 8
  dataloader_drop_last: true
  dataloader_prefetch_factor: 8
  remove_unused_columns: false

  resume_from_checkpoint: null

# =============================================================================
# Generation Settings
# =============================================================================
generation:
  max_length: 256
  min_length: 20
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  num_beams: 1
  repetition_penalty: 1.2
  length_penalty: 1.0
  no_repeat_ngram_size: 3

# =============================================================================
# Callbacks
# =============================================================================
callbacks:
  save_on_interrupt: true
  early_stopping:
    enabled: true               # Enable early stopping for v2
    patience: 3
    threshold: 0.001
  log_memory: true
  log_memory_steps: 100

# =============================================================================
# W&B Configuration
# =============================================================================
wandb:
  project: "ultrabert-decoder"
  name: "stage-c-decoder-gpt2-v2-rebalanced"
  tags:
    - "stage-c"
    - "decoder"
    - "gpt2"
    - "v2"
    - "rebalanced"
    - "anti-forgetting"
  notes: "Stage C v2: Continued fine-tuning with balanced subdomain data"
