# configs/training/multitask/stage_v3_phase0_5_enhanced.yaml
#
# Phase 0.5 Training Configuration for ModernBERT v3
# "Enhanced Healing" - Repairs cloned layers while preserving v2 capabilities
#
# Training Focus:
#   - Heal L23-28 (cloned from L15-20)
#   - Smooth L22→L23 interface
#   - Preserve L1-22 capabilities
#   - Use enhanced healing data (SST-2, CoNLL, MNLI, SQuAD, STS-B)

model:
  name: "modernbert_v3_ultra"
  pretrained_path: null  # Will be set by initialization script
  config:
    num_layers: 28
    hidden_size: 768
    num_attention_heads: 12
    num_hub_tokens: 4
    vocab_size: 50372

training:
  phase: "phase_0.5"
  phase_name: "Enhanced Healing"

  max_steps: 4000  # Slightly more steps with lower LR
  warmup_steps: 800  # CRITICAL: Longer warmup for LoRA stability
  warmup_ratio: 0.27

  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 4  # CRITICAL: Effective batch 128 for stability
  effective_batch_size: 128

  eval_steps: 250
  eval_strategy: "steps"
  save_steps: 500
  save_total_limit: 3

  logging_steps: 50
  logging_first_step: true

  fp16: false
  bf16: true

  seed: 42
  data_seed: 42

layer_freezing:
  phase: "phase_0.5"

  frozen_bands:
    - foundation
    - core

  trainable_bands:
    - semantic
    - family

  freeze_embeddings: true
  freeze_hub_tokens: false

  expected_frozen_params: "~100M"
  expected_trainable_params: "~50M"

learning_rate:
  strategy: "zipper_reversed"  # 2025 best practice: semantic > family

  # CRITICAL: Much lower base LR to prevent explosions
  base_lr: 6e-6  # Was 3e-5, reduced 5x
  layers_1_18: 0.0

  # REVERSED: Semantic band gets HIGHEST LR (it's pretrained, can handle it)
  layers_19_22: 8e-6  # Semantic - highest, most stable
  layer_23: 6e-6      # Interface layer - slightly lower
  layers_24_28: 4e-6  # Family layers - lowest (they're cloned, fragile)

  family_graduated: true
  family_decay: 0.9  # Gentler decay: L24=4e-6, L25=3.6e-6, etc.

  embeddings_lr: 0.0
  hub_tokens_lr: 5e-6  # Lower hub token LR
  task_heads_lr: 1e-5  # Heads can be slightly higher

scheduler:
  type: "cosine"
  warmup_steps: 800  # Match training.warmup_steps
  min_lr_ratio: 0.05  # Higher min LR ratio for stability

gradient:
  max_grad_norm: 1.0

  per_layer_clip: true
  interface_clip: 0.5
  semantic_clip: 1.0
  family_clip: 1.0

  log_grad_norms: true
  log_every_n_steps: 100
  explosion_threshold: 10.0

  nan_check: true
  zero_nan_grads: true

hub_tokens:
  gradient_masking: true
  freeze_original_vocab: true
  train_hub_tokens:
    - "[EMO]"
    - "[MEM]"
    - "[REL]"
    - "[TASK]"
  hub_token_grad_scale: 1.0

data:
  config_file: "configs/data/multitask/healing_enhanced.yaml"

  replay:
    enabled: true
    ratio: 0.15
    task_balanced: true
    dynamic_ratio: true
    loss_threshold: 0.5
    max_ratio: 0.3

  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

optimizer:
  type: "adamw"
  weight_decay: 0.01
  betas: [0.9, 0.99]  # CRITICAL: Lower beta2 for stability
  eps: 1e-8

loss:
  use_task_weights: true
  normalize_losses: true
  loss_clamp_max: 10.0  # NEW: Clamp extreme loss values

  # Rebalanced task weights to reduce QA dominance
  task_weights:
    sentiment: 0.8   # Slightly lower (easy task)
    ner: 1.0
    nli: 1.2         # Slightly higher (important)
    qa: 0.8          # LOWER: QA was causing spikes
    similarity: 0.8  # Lower (easy regression)

  use_uncertainty_weighting: false

lora:
  enabled: false  # Still using direct training, not PEFT LoRA
  rank: 16
  alpha: 16.0  # Lower alpha for stability (was 32)
  dropout: 0.25  # CRITICAL: Higher dropout prevents co-adaptation
  init_scale: 0.01  # NEW: Initialize LoRA weights small
  target_modules:
    - "q_proj"
    - "v_proj"  # Only Q and V, not K and O (reduces explosions)
  target_layers: [22, 23, 24, 25, 26, 27]

checkpointing:
  output_dir: "outputs/v3_phase0_5_enhanced"
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true

  save_optimizer_state: true
  save_scheduler_state: true
  save_rng_state: true

logging:
  use_wandb: true
  wandb_project: "modernbert-v3"
  wandb_run_name: "phase0_5_enhanced_healing"
  wandb_tags:
    - "phase_0.5"
    - "healing"
    - "enhanced"
    - "v3"

  logging_steps: 50
  log_level: "info"

  track_metrics:
    - train_loss
    - eval_loss
    - learning_rate
    - grad_norm
    - interface_grad_ratio

early_stopping:
  enabled: false
  patience: 5
  threshold: 0.001
  metric: "eval_loss"
  greater_is_better: false

verification:
  checkpoints: [500, 1000, 1500, 2000, 2500]

  metrics:
    - name: "interface_activation_similarity"
      description: "Activation similarity between L22 and L23"
      threshold: 0.8
      direction: "higher_is_better"

    - name: "embedding_space_stability"
      description: "Cosine similarity of embeddings before/after"
      threshold: 0.95
      direction: "higher_is_better"

    - name: "attention_entropy"
      description: "Entropy of attention patterns in L23-28"
      threshold: 2.0
      direction: "bounded"

  on_failure:
    - "log_warning"
    - "increase_replay_ratio"
