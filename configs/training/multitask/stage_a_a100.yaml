# Stage A: A100 Optimized Configuration (V2 - FULL COMPLIANCE)
# For A100-40GB/80GB GPUs (Colab Pro, GCP, etc.)
# Target GPU Memory: 30-35GB
#
# V2 COMPLIANCE CHECKLIST:
# ✅ 10 epochs (was 3) - "DO NOT SKIP THESE PHASES"
# ✅ Head-wise learning rates (encoder_lr, head_lr, token_head_lr)
# ✅ EMA model (use_ema: true, ema_decay: 0.999)
# ✅ Embedding hard negatives (15)
# ✅ Task weights per v2 spec (emotions: 1.5, safety: 2.0, embedding: 0.5)
# ✅ Uncertainty weighting enabled
# ✅ Temperature sampling for small dataset protection
# ✅ Layer decay (0.95)
# ✅ Warmup ratio 0.1
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_a100.yaml

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16  # A100 native precision
  use_flash_attention_2: false  # Set true if flash-attn installed

# Multi-task head configuration (7 generic heads for Stage A)
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 9  # CoNLL + WikiNeural: O, B/I-PER, B/I-ORG, B/I-LOC, B/I-MISC
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5
    dropout: 0.1

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 44
    problem_type: multi_label_classification
    dropout: 0.1
    use_focal_loss: true        # Focal loss for class imbalance
    focal_gamma: 2.0            # Default focal gamma
    compute_class_weights: true # Compute inverse frequency weights from training data

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8
    problem_type: multi_label_classification
    dropout: 0.1

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3
    dropout: 0.1

  embedding:
    enabled: true
    type: embedding
    pooling: mean
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13
    dropout: 0.1

# Task LOSS weights - V2 SPEC (emphasize safety + emotions, reduce embedding)
# These multiply the loss from each head BEFORE uncertainty weighting
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.5       # Emphasize emotions per v2 plan
  safety_generic: 2.0 # Emphasize safety per v2 plan
  nli: 1.0
  embedding: 0.5      # Reduce embedding dominance per v2 plan
  temporal: 1.0

# Data mixing strategy - Temperature sampling to prevent starvation
mixing:
  strategy: temperature
  temperature: 2.0       # Higher = more uniform sampling across tasks
  shuffle_seed: 42

# Head-wise optimizer configuration - V2 SPEC
optimizer:
  encoder_lr: 2e-5       # Lower LR for pretrained encoder
  head_lr: 1e-4          # Higher LR for classification heads
  token_head_lr: 5e-5    # Medium LR for token classification heads (NER, temporal)
  layer_decay: 0.95      # Gradual LR decay from top to bottom layers

# A100 OPTIMIZED Training hyperparameters - V2 COMPLIANT
training:
  # === BATCH CONFIG ===
  per_device_train_batch_size: 128   # Balanced for memory + speed
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 2     # Effective batch = 256

  # === LEARNING RATE (base, overridden by optimizer section for heads) ===
  learning_rate: 2e-5  # Used as encoder_lr fallback

  # === TRAINING DURATION - V2 SPEC: 10-12 EPOCHS ===
  num_train_epochs: 10
  max_steps: -1

  # === EMA MODEL - V2 SPEC ===
  use_ema: true
  ema_decay: 0.999

  # === UNCERTAINTY WEIGHTING - V2 SPEC ===
  use_uncertainty_weighting: true

  # === EMBEDDING HARD NEGATIVES - V2 SPEC ===
  embedding_hard_negatives: 15

  # === MEMORY OPTIMIZATION ===
  gradient_checkpointing: true

  # === OPTIMIZER ===
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  # === SCHEDULE - V2 SPEC ===
  lr_scheduler_type: cosine
  warmup_ratio: 0.1  # V2 spec warmup

  # === PRECISION ===
  bf16: true
  fp16: false

  # === EVALUATION & CHECKPOINTING ===
  eval_strategy: steps
  eval_steps: 2000        # Less frequent for longer training
  save_strategy: steps
  save_steps: 2000
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_score
  greater_is_better: true

  # === LOGGING ===
  logging_steps: 100
  report_to:
    - tensorboard

  # === REPRODUCIBILITY ===
  seed: 42
  data_seed: 42

  # === A100 DATA LOADING ===
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

# Output
output:
  output_dir: outputs/modernbert-multitask-v0-stage-a
  checkpoint_dir: checkpoints/modernbert-multitask-v0-stage-a
  logging_dir: outputs/modernbert-multitask-v0-stage-a/logs

# Data config
data_config: configs/data/multitask/stage_a_datasets.yaml
