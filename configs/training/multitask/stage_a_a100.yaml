# Stage A: A100 Optimized Configuration (V2 - Fixed Sampling)
# For A100-40GB/80GB GPUs (Colab Pro, GCP, etc.)
# Target GPU Memory: 30-35GB (was 15GB)
#
# FIXES from v1:
# - Temperature sampling to prevent small dataset starvation
# - Proper task weights for NER (~107K) and Temporal (~7K)
# - 3 epochs instead of 1
# - Higher batch size to use more GPU memory
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_a100.yaml

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16  # A100 native precision
  use_flash_attention_2: false

# Multi-task head configuration
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 9  # CoNLL + WikiNeural: O, B/I-PER, B/I-ORG, B/I-LOC, B/I-MISC
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5
    dropout: 0.1

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 32
    problem_type: multi_label_classification
    dropout: 0.1

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8
    problem_type: multi_label_classification
    dropout: 0.1

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3
    dropout: 0.1

  embedding:
    enabled: true
    type: embedding
    pooling: mean
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13
    dropout: 0.1

# Task LOSS weights (multiplies the loss from each head)
# These should typically be 1.0 - balancing is done via temperature sampling
# Dataset sizes: NLI ~942K, Embedding ~942K, Safety ~200K, NER ~107K, Sentiment ~67K, Emotions ~43K, Temporal ~10K
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.0
  safety_generic: 1.0
  nli: 1.0
  embedding: 1.0
  temporal: 1.0

# Data mixing strategy - FIXED: Use temperature sampling
mixing:
  strategy: temperature  # CHANGED from proportional - prevents starvation
  temperature: 2.0       # Higher = more uniform sampling across tasks
  shuffle_seed: 42

# A100 OPTIMIZED Training hyperparameters (Target: 30-35GB VRAM)
training:
  # === A100 HIGH MEMORY CONFIG ===
  # batch_size 256 used only 15GB, doubling to use ~30GB
  per_device_train_batch_size: 48     # Higher batch size for more GPU utilization
  per_device_eval_batch_size: 64      # Higher eval batch
  gradient_accumulation_steps: 8      # Effective batch = 48 * 8 = 384

  # Learning rate scaled for larger effective batch (sqrt scaling)
  learning_rate: 0.00003  # 3e-5 (balanced for 384 effective batch)

  # Training duration - 3 EPOCHS for proper training
  num_train_epochs: 3
  max_steps: -1

  # Gradient checkpointing ON to save memory
  gradient_checkpointing: true
  # Optimizer
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.05  # Shorter warmup for larger batch

  # A100 native BF16
  bf16: true
  fp16: false

  # Evaluation and checkpointing
  eval_strategy: steps
  eval_steps: 1000      # Eval every 1000 steps
  save_strategy: steps
  save_steps: 1000      # Save every 1000 steps
  save_total_limit: 5   # Keep more checkpoints
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_score
  greater_is_better: true

  # Logging
  logging_steps: 100
  report_to:
    - tensorboard

  # Reproducibility
  seed: 42
  data_seed: 42

  # === A100 OPTIMIZED DATA LOADING ===
  dataloader_num_workers: 4     # Colab has limited CPU
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

# Output - V2 checkpoint
output:
  output_dir: outputs/modernbert-multitask-v0-retrain
  checkpoint_dir: checkpoints/modernbert-multitask-v0-retrain
  logging_dir: outputs/modernbert-multitask-v0-retrain/logs

# Data config
data_config: configs/data/multitask/stage_a_datasets.yaml
