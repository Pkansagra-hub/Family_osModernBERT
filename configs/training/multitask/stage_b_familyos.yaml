# Stage B: FamilyOS Domain Adaptation Configuration
# Fine-tunes modernbert-multitask-v0 with FamilyOS-specific data
# Uses LoRA/adapters to preserve generic capabilities
# Output: familyos-modernbert-unified-v1

defaults:
  - /training/lora

# Base model (Stage A output)
model:
  name_or_path: outputs/modernbert-multitask-v0/best
  torch_dtype: bfloat16
  use_flash_attention_2: true

# Inherited heads from Stage A (kept frozen or lightly tuned)
heads:
  ner_general:
    enabled: true
    freeze: true  # Keep generic NER frozen

  sentiment:
    enabled: true
    freeze: false

  emotions:
    enabled: true
    freeze: false

  safety_generic:
    enabled: true
    freeze: true  # Keep as baseline

  nli:
    enabled: true
    freeze: true

  embedding:
    enabled: true
    freeze: false  # Fine-tune for FamilyOS similarity

# FamilyOS-specific heads (new)
familyos_heads:
  ner_family:
    enabled: true
    type: token_classification
    num_labels: 15  # PERSON, KINSHIP_ROLE, NICKNAME, PET, LOCATION_HOME, etc.
    dropout: 0.1

  ingress:
    enabled: true
    type: sequence_classification
    num_labels: 7  # DIARY, TASK, HEALTH, FINANCE, RELATIONSHIP, WORK, META
    dropout: 0.1

  safety_familyos:
    enabled: true
    type: sequence_classification
    num_labels: 4  # GREEN, AMBER, RED, CRISIS
    dropout: 0.1
    # Calibration thresholds set post-training

# Task sampling weights
task_weights:
  # Generic tasks (replay to prevent forgetting)
  ner_general: 0.2
  sentiment: 0.3
  emotions: 0.3
  safety_generic: 0.2
  nli: 0.1
  embedding: 0.3
  
  # FamilyOS tasks (main focus)
  ner_family: 1.0
  ingress: 1.0
  safety_familyos: 1.5

# LoRA configuration for domain adaptation
peft:
  method: lora
  lora:
    r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    task_type: FEATURE_EXTRACTION

# Training hyperparameters
training:
  learning_rate: 1e-4
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  
  # Aggressive regularization to preserve Stage A
  weight_decay: 0.1
  max_grad_norm: 0.5
  
  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  
  # Mixed precision
  bf16: true
  
  # Evaluation
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_familyos_safety_f1
  greater_is_better: true

# Output
output:
  output_dir: outputs/familyos-modernbert-unified-v1
  checkpoint_dir: checkpoints/familyos-modernbert-unified-v1

# Safety calibration (applied post-training)
calibration:
  safety_familyos:
    # Thresholds tuned on held-out FamilyOS data
    GREEN: 0.3
    AMBER: 0.5
    RED: 0.7
    CRISIS: 0.9
