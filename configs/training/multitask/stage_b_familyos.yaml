# =============================================================================
# Stage B: FamilyOS Domain Adaptation Configuration
# =============================================================================
# Fine-tunes modernbert-multitask-v0 with FamilyOS-specific data
# Uses LoRA/adapters to preserve generic capabilities
# Output: familyos-modernbert-unified-v1

defaults:
  - /training/lora

# Base model (Stage A output)
# Note: Stage A was trained WITHOUT EMA, so using regular checkpoint
model:
  name_or_path: outputs/modernbert-multitask-v0
  torch_dtype: bfloat16
  use_flash_attention_2: true

# Inherited heads from Stage A (kept frozen or lightly tuned)
heads:
  ner_general:
    enabled: true
    freeze: true  # Keep generic NER frozen

  sentiment:
    enabled: true
    freeze: false

  emotions:
    enabled: true
    freeze: false

  safety_generic:
    enabled: true
    freeze: true  # Keep as baseline

  nli:
    enabled: true
    freeze: true

  embedding:
    enabled: true
    freeze: false  # Fine-tune for FamilyOS similarity

  temporal:
    enabled: true
    freeze: false  # Fine-tune for family temporal expressions

# FamilyOS-specific heads (new)
familyos_heads:
  ner_family:
    enabled: true
    type: token_classification
    num_labels: 21  # 21 BIO tags for family NER (see NER_FAMILY_LABELS)
    dropout: 0.1

  ingress:
    enabled: true
    type: sequence_classification
    num_labels: 12  # 12 domains (see INGRESS_LABELS)
    dropout: 0.1

  safety_familyos:
    enabled: true
    type: sequence_classification
    num_labels: 4  # GREEN, AMBER, RED, CRISIS
    dropout: 0.1
    # Calibration thresholds set post-training

  intent:
    enabled: true
    type: sequence_classification
    num_labels: 8  # 8 intents (see INTENT_LABELS)
    dropout: 0.1

  relation:
    enabled: true
    type: relation_classification
    num_labels: 15  # 15 relation types (see RELATION_LABELS)
    dropout: 0.1

# Task sampling weights (per unified_encoder_solution.md specifications)
# UPDATED per expert advice:
#   - safety_familyos: 15.0 → 5.0 (CRISIS already oversampled)
#   - emotions: 0.3 → 1.0 (prevent being drowned out by safety)
task_weights:
  # Generic tasks (replay to prevent forgetting)
  ner_general: 0.5       # Plan: 0.5
  sentiment: 0.3         # Plan: 0.3
  emotions: 1.0          # ← was 0.3, raised to train emotions properly
  safety_generic: 0.2
  nli: 0.3               # Plan: 0.3
  embedding: 0.3

  # FamilyOS tasks (main focus)
  ner_family: 2.0        # Plan: 2.0
  ingress: 1.5           # Plan: 1.5
  safety_familyos: 5.0   # ← was 15.0, reduced since CRISIS already oversampled
  intent: 1.5            # Plan: 1.5
  relation: 2.0          # Plan: 2.0
  temporal: 1.0          # Plan: 1.0

# LoRA configuration for domain adaptation
peft:
  method: lora
  lora:
    r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    bias: none
    # ModernBERT layer names:
    # - Wqkv: combined Q,K,V projection
    # - Wo: output projection (attention)
    # - Wi: intermediate projection (MLP, input)
    # - Wo: output projection (MLP) - same name, diff layer
    target_modules:
      - Wqkv
      - Wo
      - Wi
    task_type: FEATURE_EXTRACTION

# =============================================================================
# Epic 5.0 Enhancements (Optional)
# =============================================================================
# These enhancements improve NLI and Relation task performance:
# - Shared pooler: CLSMeanPooler combines CLS + mean pooling
# - Pair encoder: CrossAttentionPairEncoder for premise-hypothesis interaction
epic5:
  use_shared_pooler: true
  shared_pooler_type: cls_mean  # Options: cls_mean, attention
  use_pair_encoder: true
  pair_encoder_num_layers: 2

# Training hyperparameters
training:
  learning_rate: 1e-4
  num_train_epochs: 5    # Plan says 5-8 epochs
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  # Regularization (0.01 per plan to avoid over-regularization)
  weight_decay: 0.01
  max_grad_norm: 0.5

  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.1

  # Mixed precision
  bf16: true

  # Evaluation (use HF field name)
  evaluation_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_safety_familyos_f1
  greater_is_better: true

# Output
output:
  output_dir: outputs/familyos-modernbert-unified-v1
  checkpoint_dir: checkpoints/familyos-modernbert-unified-v1

# =============================================================================
# REPLAY CONFIGURATION (prevent catastrophic forgetting)
# =============================================================================
# Per plan: ~10% of training batches should be Stage A replay data
replay:
  enabled: true
  ratio: 0.1  # 10% of batches are Stage A tasks
  tasks:
    - ner_general
    - nli
    - emotions
    - sentiment

# =============================================================================
# SAFETY OVERSAMPLING (CRITICAL for CRISIS recall ≥98%)
# =============================================================================
safety_oversampling:
  enabled: true
  CRISIS: 20  # 20x oversampling for CRISIS class
  RED: 5      # 5x oversampling for RED class
  AMBER: 1
  GREEN: 1

# =============================================================================
# Safety calibration (applied post-training via scripts/calibrate_safety.py)
# =============================================================================
# NOTE: These thresholds are STARTING POINTS only.
# The calibration script will search for optimal thresholds on held-out data.
calibration:
  enabled: true
  safety_familyos:
    # Initial thresholds (will be replaced by calibration script)
    GREEN: 0.3
    AMBER: 0.5
    RED: 0.7
    CRISIS: 0.3  # Low threshold - better to false-positive than miss
  temperature_scaling: true
  temperature_init: 1.15
