# Stage A: Generic Multi-Task Training Configuration
# Trains ModernBERT on public datasets (no FamilyOS data)
# Output: modernbert-multitask-v0

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: bfloat16
  use_flash_attention_2: true

# Multi-task head configuration
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 9  # BIO tags for PER, ORG, LOC, MISC
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 3  # negative, neutral, positive
    dropout: 0.1

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 12  # GoEmotions reduced set
    problem_type: multi_label_classification
    dropout: 0.1

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 6  # toxic, severe_toxic, obscene, threat, insult, identity_hate
    problem_type: multi_label_classification
    dropout: 0.1

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3  # entailment, neutral, contradiction
    dropout: 0.1

  embedding:
    enabled: true
    type: embedding
    pooling: mean  # cls, mean, max
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]  # Optional Matryoshka dimensions

# Task sampling weights (proportional sampling)
task_weights:
  ner_general: 1.0
  sentiment: 1.0
  emotions: 1.0
  safety_generic: 1.5  # Slightly upweight safety
  nli: 1.0
  embedding: 0.5  # Contrastive learning is expensive

# Training hyperparameters
training:
  learning_rate: 2e-5
  num_train_epochs: 5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  
  # Optimizer
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  
  # Mixed precision
  bf16: true
  
  # Evaluation
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_f1
  greater_is_better: true
  
  # Logging
  logging_steps: 100
  report_to:
    - tensorboard
    - wandb

# Output
output:
  output_dir: outputs/modernbert-multitask-v0
  checkpoint_dir: checkpoints/modernbert-multitask-v0
