# Stage A: Generic Multi-Task Training Configuration
# Trains ModernBERT on public datasets (no FamilyOS data)
# Output: modernbert-multitask-v0
#
# Usage:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_generic.yaml
#
# Quick test (100 steps):
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_generic.yaml training.max_steps=100
#
# Resume from checkpoint:
#   python scripts/train_stage_a.py --config configs/training/multitask/stage_a_generic.yaml \
#       --resume_from_checkpoint checkpoints/modernbert-multitask-v0/checkpoint-5000

defaults:
  - /training/default

# Base model
model:
  name_or_path: answerdotai/ModernBERT-base
  torch_dtype: float16  # Use float16 for older GPUs, bfloat16 for Ampere+
  use_flash_attention_2: false  # Set to true if flash-attn is installed

# Multi-task head configuration
heads:
  ner_general:
    enabled: true
    type: token_classification
    num_labels: 17  # BIO tags for PER, ORG, LOC, MISC, DATE, TIME, EVENT, PRODUCT
    dropout: 0.1

  sentiment:
    enabled: true
    type: sequence_classification
    num_labels: 5  # 5-point scale from data/labels.py
    dropout: 0.1

  emotions:
    enabled: true
    type: sequence_classification
    num_labels: 32  # Full 32 emotions from EMOTIONS_LABELS
    problem_type: multi_label_classification
    dropout: 0.1

  safety_generic:
    enabled: true
    type: sequence_classification
    num_labels: 8  # 8 toxicity types from SAFETY_GENERIC_LABELS
    problem_type: multi_label_classification
    dropout: 0.1

  nli:
    enabled: true
    type: sequence_classification
    num_labels: 3  # entailment, neutral, contradiction
    dropout: 0.1

  embedding:
    enabled: true
    type: embedding
    pooling: mean  # cls, mean, max
    normalize: true
    matryoshka_dims: [768, 512, 256, 128]  # Optional Matryoshka dimensions

  temporal:
    enabled: true
    type: token_classification
    num_labels: 13  # Temporal BIO tags from TEMPORAL_LABELS
    dropout: 0.1

# Task sampling weights (proportional sampling)
# NOTE: With WikiNeural added, NER is now 107K (was 14K)
# Dataset sizes: NLI ~942K, Embedding ~942K, NER 107K, Sentiment 67K, Safety 50K, Emotions 43K, Temporal ~4K
# With temperature sampling, weights adjust relative importance
task_weights:
  ner_general: 5.0     # Now 107K samples with WikiNeural (reduced from 50)
  sentiment: 1.0
  emotions: 1.0
  safety_generic: 1.5  # Slightly upweight safety
  nli: 0.5             # Large dataset, downweight to balance
  embedding: 0.3       # Very large dataset, downweight
  temporal: 100.0      # CRITICAL: Only ~4K samples, needs heavy upweight

# Data mixing strategy
mixing:
  strategy: temperature  # Use temperature sampling for better balance
  temperature: 2.0       # Higher = more uniform across tasks
  shuffle_seed: 42

# Training hyperparameters
training:
  # Core optimization
  learning_rate: 0.00002  # 2e-5
  num_train_epochs: 5
  max_steps: -1  # Set to positive value to override epochs
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2
  gradient_checkpointing: true

  # Optimizer
  optim: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.1

  # Mixed precision (RTX 5070 Blackwell supports bf16)
  bf16: true
  fp16: false

  # Evaluation
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_avg_score
  greater_is_better: true

  # Logging
  logging_steps: 100
  report_to:
    - tensorboard
    # - wandb  # Uncomment to enable W&B logging

  # Reproducibility
  seed: 42
  data_seed: 42

  # Data loading
  dataloader_num_workers: 4
  dataloader_pin_memory: true

# Output
output:
  output_dir: outputs/modernbert-multitask-v0
  checkpoint_dir: checkpoints/modernbert-multitask-v0
  logging_dir: outputs/modernbert-multitask-v0/logs
