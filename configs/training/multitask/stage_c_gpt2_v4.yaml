# =============================================================================
# Stage C v4: Fresh GPT-2 with Proper Token Initialization
# =============================================================================
# PURPOSE: Train from FRESH GPT-2 Medium (NOT from V1 checkpoint) with properly
#          initialized BOS/EOS/PAD tokens. This fixes the 56% embedding magnitude
#          gap that caused quality issues in v1-v3.
#
# CRITICAL CHANGE: Starting from fresh GPT-2 Medium, NOT from V1 checkpoint.
# This ensures _initialize_new_token_embeddings() runs on fresh weights.
#
# Root Cause Fixed:
#   - V1-V3 had new tokens (50257-50367) with norm ~2.1 vs GPT-2's ~3.9
#   - BOS/EOS tokens were too "quiet" relative to GPT-2 vocabulary
#   - This caused weak start/stop signals and generation quality issues
#
# V4 Token Initialization:
#   - New tokens (50257-50280): Initialized to mean of GPT-2 embeddings
#   - BOS (50281): Copied from GPT-2's <|endoftext|> token (50256)
#   - EOS (50282): Copied from GPT-2's <|endoftext|> token (50256)
#   - PAD (50283): Zero vector (no attention contribution)
#
# Expected Improvements:
#   - Proper embedding scale from epoch 0
#   - Stronger BOS/EOS signals for better generation boundaries
#   - Higher quality counterfactual outputs
#
# Training Data:
#   - Location: data/counterfactual/training_v3 (balanced dataset)
#   - Includes driving test, school choice, and neutral/positive valence samples
#
# Usage:
#   python scripts/train_stage_c.py --config configs/training/multitask/stage_c_gpt2_v4.yaml
#
# Related:
#   - docs/DECODER_EMBEDDING_ANALYSIS.md (full analysis)
#   - Milestone 2, Epic 2.1.1 (implementation)
# =============================================================================

# =============================================================================
# Base Model (Load ENCODER from Stage B, fresh decoder)
# =============================================================================
model:
  # Load encoder + 12 heads from Stage B checkpoint
  checkpoint_path: "outputs/modernbert-v2-for-v3-transfer/checkpoint-18000"

  freeze_encoder: true
  freeze_existing_heads: true

  torch_dtype: bfloat16
  use_flash_attention_2: true

# =============================================================================
# Decoder Configuration (Fresh GPT-2 Medium)
# =============================================================================
decoder:
  type: "gpt2"
  # CRITICAL: Use fresh GPT-2 Medium, NOT a fine-tuned checkpoint
  gpt2_model_name: "gpt2-medium"  # ~355M params, 24 layers, 1024 hidden

  projection_hidden_size: 1024
  prefix_projection_layers: 1
  use_prefix_injection: true

  freeze_layers: 0              # Train all layers

  max_position_embeddings: 512
  vocab_size: 50368             # ModernBERT tokenizer vocab size

  # Special token IDs (must match tokenizer)
  pad_token_id: 50283
  bos_token_id: 50281
  eos_token_id: 50282

  # Regularization (same as v3)
  dropout: 0.15

  # Generation defaults
  generation_max_length: 128
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2

# =============================================================================
# Data Configuration (New balanced dataset)
# =============================================================================
data:
  # V4 uses the new balanced dataset with:
  # - Driving test scenarios (500+)
  # - School choice scenarios (500+)
  # - Neutral/positive valence samples (10K+)
  train_path: "data/counterfactual/training_v3"

  embeddings_mode: "precomputed"
  full_sequence: true

  max_input_length: 256
  max_output_length: 256

  num_workers: 16
  pin_memory: true
  prefetch_factor: 16
  persistent_workers: true
  load_to_ram: true

# =============================================================================
# Training Configuration
# =============================================================================
training:
  output_dir: "outputs/ultrabert-gen-decoder-v4"
  checkpoint_dir: "checkpoints/ultrabert-gen-decoder-v4"

  # Training schedule (similar to v1 for fresh model)
  num_train_epochs: 8          # Full training on fresh model
  max_steps: -1

  # Batch configuration (A100 80GB optimized)
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 256
  gradient_accumulation_steps: 2
  # Effective batch size: 64 × 2 = 128

  # Learning rate (higher for fresh model)
  learning_rate: 1.0e-4         # Same as v1 (fresh model needs higher LR)

  # Regularization
  weight_decay: 0.01            # Standard weight decay for fresh training
  max_grad_norm: 1.0

  # LR schedule
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.10            # 10% warmup for stability

  optim: "adamw_torch_fused"

  bf16: true
  fp16: false

  gradient_checkpointing: false  # Disabled - A100 80GB has plenty of memory
  dataloader_pin_memory: true
  torch_compile: true           # Enabled for A100 performance boost
  tf32: true

  # Checkpoint frequency
  save_strategy: "steps"
  save_steps: 500               # Save every 500 steps
  save_total_limit: 5           # Keep more checkpoints with ample storage
  save_safetensors: true

  eval_strategy: "steps"
  eval_steps: 500

  logging_strategy: "steps"
  logging_steps: 10
  logging_first_step: true

  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  report_to:
    - "tensorboard"

  seed: 42

  dataloader_num_workers: 16
  dataloader_drop_last: true
  dataloader_prefetch_factor: 16
  remove_unused_columns: false

  resume_from_checkpoint: null

# =============================================================================
# Generation Settings
# =============================================================================
generation:
  max_length: 256
  min_length: 20
  temperature: 0.5
  top_p: 0.9
  top_k: 50
  do_sample: true
  num_beams: 1
  repetition_penalty: 1.2
  length_penalty: 1.0
  no_repeat_ngram_size: 3

# =============================================================================
# Evaluation Callbacks Configuration
# =============================================================================
evaluation:
  # GenerationEvalCallback settings
  num_gen_samples: 50           # Number of samples for generation quality eval
  gen_eval_steps: 500           # Run generation eval every N steps
  max_new_tokens: 64            # Max tokens to generate per sample
  temperature: 0.7              # Sampling temperature for generation
  valence: "positive"           # Expected valence for format adherence check

  # Additional metrics (computed during generation eval)
  compute_bleu: true            # Compute BLEU score against references
  compute_rouge: true           # Compute ROUGE-L score
  compute_distinct_n: true      # Compute Distinct-1/2/3 diversity metrics

  # Expert utilization tracking (for MoE debugging)
  log_expert_utilization: true  # Log expert load balance stats
  expert_util_steps: 1000       # Log expert stats every N steps

# =============================================================================
# Callbacks
# =============================================================================
callbacks:
  save_on_interrupt: true
  early_stopping:
    enabled: true
    patience: 5
    threshold: 0.001
  log_memory: true
  log_memory_steps: 100

# =============================================================================
# W&B Configuration
# =============================================================================
wandb:
  project: "ultrabert-decoder"
  name: "stage-c-decoder-gpt2-v4-fresh"
  tags:
    - "stage-c"
    - "decoder"
    - "gpt2"
    - "v4"
    - "fresh-init"
    - "fixed-embeddings"
    - "balanced-data"
  notes: |
    Stage C v4: FRESH GPT-2 with proper token initialization.

    Key fixes:
    1. _initialize_new_token_embeddings() implemented
    2. BOS/EOS copied from endoftext (norm ~3.1)
    3. PAD initialized to zero vector
    4. New tokens initialized to mean embedding

    Training from scratch on balanced dataset including:
    - Driving test scenarios
    - School choice scenarios
    - Neutral/positive valence samples

    Expected improvements:
    - Proper BOS/EOS signals for better generation
    - Higher quality counterfactual outputs
    - Consistent embedding scales across vocabulary
