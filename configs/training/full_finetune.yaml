# Full Fine-tuning Configuration
defaults:
  - default

# Training settings for full fine-tuning
training:
  learning_rate: 1e-5
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  gradient_checkpointing: true

  # Memory optimization for full fine-tuning
  fp16: false
  bf16: true
  tf32: true

  # Optimizer
  optim: adamw_torch_fused
  weight_decay: 0.1
  max_grad_norm: 1.0

  # Schedule
  lr_scheduler_type: cosine
  warmup_ratio: 0.1

  # Evaluation
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2

  # Logging
  logging_steps: 50

# Model settings
model:
  load_in_8bit: false
  load_in_4bit: false
  torch_dtype: bfloat16
  use_flash_attention_2: true
