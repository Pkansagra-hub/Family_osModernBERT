# Local smoke-test config for joint bake-off validation
encoder:
  checkpoint: outputs/globalpointer-unified-v1/best
  freeze: true
  hidden_size: 768
  dtype: float32

embedding_head:
  output_dim: null
  normalize: true

loss:
  type: infonce
  temperature: 0.07
  hard_negative_weight: 1.5
  learnable_temperature: true
  temperature_lr: 1.0e-3
  use_in_batch_negatives: true

training:
  learning_rate: 2.0e-4
  encoder_lr: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  flash_attention: true
  ema:
    enabled: true
  early_stopping:
    enabled: true
    patience: 2
  curriculum:
    enabled: true
    warmup_epochs: 2
  matryoshka:
    enabled: true
    dims: [768, 512, 256, 128]
  lr_scheduler_type: cosine
  warmup_steps: 10
  num_epochs: 1
  max_steps: -1
  val_split: 0.1
  batch_size: 64
  gradient_accumulation_steps: 1
  eval_steps: 2
  save_steps: 1000
  save_total_limit: 2
  max_eval_batches: 2
  logging_steps: 1
  seed: 42

data:
  root: data
  max_length: 128
  num_workers: 0
  embedding:
    train: familyos/embeddings/silver_synthetic,familyos/embeddings/hard_negatives
    validation: ""

output:
  dir: outputs/embedding-bakeoff-localtest
  save_encoder: true
  save_heads: true
  save_optimizer: false
  save_history: true

experiments:
  heads:
    - head_type: mean_baseline
      params: {}
    - head_type: residual_mlp_mean
      params:
        intermediate_dim: 768
    - head_type: latent_residual
      params:
        num_latents: 4
        num_attn_heads: 4
    - head_type: agreement_gated
      params:
        num_latents: 4
        num_attn_heads: 4
        gate_hidden: 64
    - head_type: multi_pool_low_rank
      params:
        num_latents: 4
        num_attn_heads: 4
        rank: 8
    - head_type: anisotropy_corrected
      params:
        use_low_rank_whiten: true
        whiten_rank: 32
