# =============================================================================
# Embedding Head Bake-Off Configuration
# =============================================================================
# Train 7 candidate embedding heads under identical conditions.
# Derived from embedding_head_retrain.yaml.
#
# Usage:
#   # Single head
#   python scripts/training/train_embedding_heads_bakeoff.py \
#       --config configs/training/embedding_heads_bakeoff.yaml \
#       --head_type agreement_gated
#
#   # Train all heads together in one shared-encoder run
#   python scripts/training/train_embedding_heads_bakeoff.py \
#       --config configs/training/embedding_heads_bakeoff.yaml \
#       --run_all
#
#   # Legacy sequential mode
#   python scripts/training/train_embedding_heads_bakeoff.py \
#       --config configs/training/embedding_heads_bakeoff.yaml \
#       --run_sequential
#
#   # Debug mode
#   python scripts/training/train_embedding_heads_bakeoff.py \
#       --config configs/training/embedding_heads_bakeoff.yaml \
#       --head_type mean_baseline --debug --max_samples 500
#
# Output: outputs/embedding-bakeoff/<head_type>/

# =============================================================================
# Runtime / Colab Execution Mode
# =============================================================================
# Backward-compatible run selector. Existing bake-off flows remain the default.
# Future script support will use this section to switch between:
#   - bakeoff: existing head bake-off / stage_b flows
#   - teacher_cache: build Qwen teacher embedding cache only
#   - distill: load student checkpoint + teacher cache and distill
runtime:
  mode: bakeoff
  student_checkpoint: /content/Modeling_studio/outputs/embedding-bakeoff/agreement_gated_v2/best

# =============================================================================
# Teacher Configuration (Milestone 1)
# =============================================================================
# Declarative config only for now. Milestone 2 will wire this into the existing
# training script without introducing new files.
teacher:
  enabled: false
  model_name: Qwen/Qwen3-Embedding-4B
  device: cuda
  dtype: bfloat16
  attn_implementation: flash_attention_2
  max_length: 128
  batch_size: 1024
  normalize: true

  cache:
    dir: outputs/teacher-cache/qwen3-embedding-4b
    overwrite: false
    shard_size: 50000
    save_text_index: true

  # Query/doc asymmetry matters for query_doc retrieval.
  prompts:
    use_query_prompt_for_query_doc: true
    query_instruction: "Given a user query, retrieve the most relevant FamilyOS memory or passage."

  # Reuse existing embedding sources and optionally add broader FamilyOS corpus.
  source_sets:
    use_data_sources: true
    use_stage_b_profile: false

  corpus_sources:
    - path: familyos/unified/output_healed_merged
      slice: unified_corpus
      format: text
      text_keys: [text]
      mode: document

    - path: familyos/emotions
      slice: emotions_corpus
      format: text
      text_keys: [text]
      mode: document

    - path: familyos/safety
      slice: safety_corpus
      format: text
      text_keys: [text]
      mode: document

    - path: familyos/relations
      slice: relations_corpus
      format: text
      text_keys: [text, text_a, text_b]
      mode: document

    - path: familyos/temporal
      slice: temporal_corpus
      format: text
      text_keys: [text, tokens]
      mode: document

    - path: familyos/temporal_span
      slice: temporal_span_corpus
      format: text
      text_keys: [text]
      mode: document

# =============================================================================
# Distillation Configuration (Milestone 1)
# =============================================================================
# Distillation remains disabled until Milestone 3 wires these values into the
# existing bake-off training loop.
distillation:
  enabled: false
  teacher_cache_dir: outputs/teacher-cache/qwen3-embedding-4b
  freeze_encoder: true
  use_teacher_for_query_doc_only: false

  losses:
    student_contrastive_weight: 0.70
    teacher_vector_weight: 0.15
    teacher_ranking_weight: 0.15
    teacher_temperature: 0.05
    teacher_temperature_start: 0.20
    teacher_temperature_end: 0.02
    vector_loss_type: cosine

  projection:
    enabled: true
    type: linear
    teacher_dim: 2560
    student_dim: 768

  train_sources:
    use_data_sources: true
    use_stage_b_profile: true

  training_overrides:
    learning_rate: 7.5e-5
    num_epochs: 16
    warmup_steps: 400
    early_stopping:
      patience: 6

  evaluation_overrides:
    selection_metric: query_doc_recall_at_5

  data_overrides:
    sampling:
      strategy: balanced
      slice_weights:
        hard_negatives: 2.0
        wrong_person: 4.0
        wrong_time: 6.0
        safety_emotion: 6.0
        query_doc: 5.0

  auxiliary_losses:
    enabled: true
    apply_slices: [safety_emotion]
    base_margin: 0.05
    safety_label_weight: 0.08
    safety_margin_scale: 0.04
    emotion_label_weight: 0.05
    emotion_margin: 0.03

  # 2-phase distillation: warm up projection before full distillation mix
  two_phase:
    enabled: true
    projection_warmup_epochs: 3
    projection_warmup_lr: 5e-4

# =============================================================================
# MGRH Training Configuration (Milestone 3)
# =============================================================================
# Multi-Granularity Relevance Head training. Opt-in, does not affect existing
# bakeoff/stage_b flows when disabled or absent.
#
# Usage:
#   python scripts/training/train_embedding_heads_bakeoff.py \
#       --config configs/training/embedding_heads_bakeoff.yaml \
#       --mgrh_stage a
#
mgrh_training:
  enabled: false    # opt-in — set true to activate MGRH training path

  # --- Head architecture ---
  head:
    type: multi_granularity_relevance
    hidden_size: 768
    dropout: 0.1
    use_pair_encoder: true
    pair_encoder:
      num_heads: 8
      num_layers: 2             # 2-layer ESIM for chain-of-alignment reasoning
      use_bidirectional: true
      pooling_strategy: attention
      dropout: 0.1
    use_asymmetric_embeddings: true   # Signal 3 from AgreementGatedHeadV2
    use_maxsim: true                  # Signal 4: ColBERT-style token-level alignment
    use_domain_saliency: true         # TemporalHead + NERHead as attention weights

  # --- Checkpoint & freezing ---
  base_checkpoint: /content/Modeling_studio/outputs/embedding-bakeoff/stage_b/best-ema

  freeze:
    encoder: true
    existing_heads: true
    trainable_modules:
      - relevance_head
      - pair_encoder

  # --- Multi-stage training ---
  stages:
    stage_a:
      name: general_nli_pretrain
      data_root: data/familyos/nli/general
      sources:
        - path: mnli_train.jsonl
          weight: 1.0
        - path: snli_train.jsonl
          weight: 1.0
        - path: wanli_train.jsonl
          weight: 1.0
        - path: fever_nli_train.jsonl
          weight: 0.8
        # ANLI excluded by default (CC-BY-NC-4.0 commercial blocker).
        # Uncomment below only if non-commercial use is confirmed:
        # - path: anli_r1.jsonl
        #   weight: 1.2
        # - path: anli_r2.jsonl
        #   weight: 1.2
        # - path: anli_r3.jsonl
        #   weight: 1.5    # R3 hardest, most valuable
      loss:
        type: cross_entropy    # 3-class NLI
        label_smoothing: 0.0
        contrastive_nli:       # SimCSE-style contrastive alongside CE
          enabled: true
          weight: 0.3
          temperature: 0.05
      epochs: 5
      lr_head: 2.0e-4
      lr_pair_encoder: 1.0e-4
      batch_size: 128
      max_length: 256

    stage_b:
      name: domain_nli_adaptation
      data_root: data/familyos/embeddings
      sources:
        - path: hard_negatives
          include_types: [entity_swap, temporal_shift, same_topic_different_event, causality_flip]
          weight: 0.6
        - path: mined_v2/wrong_time
          weight: 0.8
          hard_negative_weight: 4.0
        - path: mined_v2/wrong_person
          weight: 0.8
          hard_negative_weight: 2.0
      loss:
        type: pairwise_margin
        margin: 0.2
      epochs: 5
      lr_head: 1.0e-4
      lr_pair_encoder: 5.0e-5
      batch_size: 32
      max_length: 512    # query (~50 tok) + episode (~400 tok)

    bridge_bc:
      name: bridge_b_to_c
      # 500-step bridge prevents loss discontinuity from Stage B (pairwise margin)
      # to Stage C (graded LambdaRank). Joint loss lets the pair encoder adapt
      # smoothly instead of cold-switching.
      data_root: data/familyos/nli/relevance
      sources:
        - path: human_benchmark_listwise_v2.jsonl
          format: listwise
          weight: 1.0
      loss:
        type: bridge_joint
        pairwise_margin_weight: 0.7   # dominant — preserve Stage B discrimination
        relevance_bce_weight: 0.3     # introduce graded relevance gently
        margin: 0.2
      max_steps: 500                  # fixed step count, not epoch-based
      lr_head: 5.0e-5                 # half of Stage B LR
      lr_pair_encoder: 2.5e-5
      batch_size: 32
      max_length: 512

    stage_c:
      name: relevance_finetune
      data_root: data/familyos
      sources:
        - path: nli/relevance/human_benchmark_listwise_v2.jsonl
          format: listwise
          weight: 1.0
        - path: nli/relevance/query_doc_listwise.jsonl
          format: listwise
          weight: 0.4          # 10,019 converted pairs; down-weighted vs 798-sample human benchmark
      loss:
        type: combined_ranking
        lambda_rank_weight: 1.0
        pairwise_margin_weight: 0.3
        margin: 0.2
        ndcg_at: 10
        r_drop:                # R-Drop regularization (Liang et al., 2021)
          enabled: true
          alpha: 1.0           # KL divergence weight
      ance:                    # ANCE dynamic hard negative refresh
        enabled: true
        refresh_every_n_epochs: 3
        mine_top_k: 20
        max_refresh_negatives: 5000
      epochs: 15              # increased from 10 — augmented v2 data has 3x episodes
      lr_head: 1.0e-4
      lr_pair_encoder: 5.0e-5
      batch_size: 64
      max_length: 512
      calibration:             # post-training score calibration
        enabled: true
        method: temperature_scaling
        max_iter: 50

  # --- Evaluation ---
  evaluation:
    selection_metric: spearman_correlation
    gate_metrics:
      spearman_correlation: 0.50     # minimum to ship
      auc_roc: 0.80                  # minimum to ship
    eval_steps: 200
    save_steps: 200
    ema:
      enabled: true
      decay: 0.995
    early_stopping:
      enabled: true
      patience: 5
      metric: spearman_correlation

# =============================================================================
# Encoder Configuration (FROZEN)
# =============================================================================
encoder:
  checkpoint: /content/Modeling_studio/outputs/globalpointer-unified-v1/checkpoint-8000
  freeze: true
  hidden_size: 768
  dtype: float32

# =============================================================================
# Default Embedding Head Parameters
# =============================================================================
# These are defaults; per-experiment overrides are in experiments.heads[].params
embedding_head:
  output_dim: null      # null = keep full 768
  normalize: true

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  type: infonce
  temperature: 0.07
  hard_negative_weight: 1.5
  learnable_temperature: true
  temperature_lr: 1.0e-3
  use_in_batch_negatives: true

# =============================================================================
# Training Configuration
# =============================================================================
training:
  learning_rate: 2.0e-4
  encoder_lr: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # Mixed Precision (A100/H100)
  bf16: true
  fp16: false
  tf32: true
  flash_attention: true

  # EMA and Early Stopping
  ema:
    enabled: true
  early_stopping:
    enabled: true
    patience: 5

  # Curriculum Learning
  curriculum:
    enabled: true
    warmup_epochs: 2

  # Matryoshka
  matryoshka:
    enabled: true
    dims: [768, 512, 256, 128]

  # Schedule
  lr_scheduler_type: cosine
  warmup_steps: 200

  # Training duration
  num_epochs: 12
  max_steps: -1
  val_split: 0.1

  # Batch size
  batch_size: 2048
  gradient_accumulation_steps: 1

  # Evaluation & saving
  eval_steps: 500
  save_steps: 500
  save_total_limit: 5
  max_eval_batches: 100

  # Logging
  logging_steps: 50
  seed: 42

# =============================================================================
# Data Configuration
# =============================================================================
data:
  root: data
  max_length: 128
  num_workers: 12
  eval_split_per_slice: 0.15

  # Structured source list (replaces old embedding.train comma string)
  sources:
    - path: familyos/embeddings/silver_synthetic
      slice: silver_synthetic
      format: triplet

    - path: familyos/embeddings/hard_negatives
      slice: hard_negatives
      format: triplet

    - path: familyos/embeddings/mined_v2/wrong_person
      slice: wrong_person
      format: triplet

    - path: familyos/embeddings/mined_v2/wrong_time
      slice: wrong_time
      format: triplet

    - path: familyos/embeddings/mined_v2/safety_emotion
      slice: safety_emotion
      format: triplet

    - path: familyos/embeddings/mined_v2/query_doc
      slice: query_doc
      format: pair

  sampling:
    strategy: balanced
    slice_weights:
      silver_synthetic: 1.0
      hard_negatives: 2.0
      wrong_person: 4.0
      wrong_time: 4.0
      safety_emotion: 5.0
      query_doc: 3.0

  profiles:
    stage_a_core:
      sources:
        - path: familyos/embeddings/silver_synthetic
          slice: silver_synthetic
          format: triplet

        - path: familyos/embeddings/hard_negatives
          slice: hard_negatives
          format: triplet

      sampling:
        strategy: balanced
        slice_weights:
          silver_synthetic: 1.0
          hard_negatives: 2.0

    stage_b_v2:
      sources:
        - path: familyos/embeddings/hard_negatives
          slice: hard_negatives
          format: triplet

        - path: familyos/embeddings/mined_v2/wrong_person
          slice: wrong_person
          format: triplet

        - path: familyos/embeddings/mined_v2/wrong_time
          slice: wrong_time
          format: triplet

        - path: familyos/embeddings/mined_v2/safety_emotion
          slice: safety_emotion
          format: triplet

        - path: familyos/embeddings/mined_v2/query_doc
          slice: query_doc
          format: pair

      sampling:
        strategy: balanced
        slice_weights:
          hard_negatives: 2.0
          wrong_person: 4.0
          wrong_time: 4.0
          safety_emotion: 5.0
          query_doc: 4.0

# =============================================================================
# Evaluation & Model Selection
# =============================================================================
evaluation:
  selection_metric: composite
  composite_weights:
    aggregate_margin: 0.30
    hard_neg_accuracy: 0.15
    wrong_person_accuracy: 0.15
    wrong_time_accuracy: 0.10
    safety_emotion_accuracy: 0.10
    query_doc_recall_at_5: 0.15
    confidence_alignment: 0.05

# =============================================================================
# Stage A Bake-Off Configuration
# =============================================================================
bakeoff:
  data_profile: stage_a_core

# =============================================================================
# Stage B Configuration
# =============================================================================
stage_b:
  data_profile: stage_b_v2
  head_type: agreement_gated_v2
  reuse_checkpoint_head_as_is: true
  training_overrides:
    learning_rate: 7.5e-5
    num_epochs: 10
    warmup_steps: 40
    early_stopping:
      patience: 4

  evaluation_overrides:
    selection_metric: query_doc_recall_at_1

  data_overrides:
    sampling:
      strategy: balanced
      slice_weights:
        hard_negatives: 1.5
        wrong_person: 3.5
        wrong_time: 5.0
        safety_emotion: 5.0
        query_doc: 8.0

  head_params:
    num_latents: 4
    num_attn_heads: 4
    gate_hidden: 128
    gate_rank: 4
    use_mode_prompts: true
    use_confidence_head: true
    dropout: 0.1

  mode_routing:
    default_anchor_mode: document
    default_positive_mode: document
    default_negative_mode: document
    anchor_query_slices: [query_doc]

  retrieval_modes:
    query: query
    document: document

  aux_objectives:
    enabled: true
    role_entropy_weight: 0.02
    temporal_entropy_weight: 0.02
    safety_entropy_weight: 0.02

  # Teacher regularizer: carry Qwen signal into Stage B as a soft constraint
  teacher_regularizer:
    enabled: true
    # teacher_cache_dir: falls back to distillation.teacher_cache_dir when omitted
    teacher_temperature: 0.05
    vector_weight: 0.05
    ranking_weight: 0.05
    projection:
      enabled: true
      teacher_dim: 2560
      student_dim: 768

# =============================================================================
# Output Configuration
# =============================================================================
output:
  # Base output directory. Each experiment creates a subdirectory.
  dir: outputs/embedding-bakeoff
  save_encoder: true
  save_heads: true
  save_optimizer: true
  save_history: true

# =============================================================================
# Experiment Definitions (7-Head Bake-Off)
# =============================================================================
experiments:
  heads:
    # E0: Baseline - no learned params (control)
    - head_type: mean_baseline
      params: {}

    # E1: Simplest learned residual over encoder_mean
    - head_type: residual_mlp_mean
      params:
        intermediate_dim: 768

    # E2: Bounded latent-attention residual
    - head_type: latent_residual
      params:
        num_latents: 4
        num_attn_heads: 4

    # E3: Novel agreement-gated refinement (flagship candidate)
    - head_type: agreement_gated
      params:
        num_latents: 4
        num_attn_heads: 4
        gate_hidden: 64

    # E4: Multi-view low-rank fusion
    - head_type: multi_pool_low_rank
      params:
        num_latents: 4
        num_attn_heads: 4
        rank: 8

    # E5: Anisotropy correction (cosine geometry repair)
    - head_type: anisotropy_corrected
      params:
        use_low_rank_whiten: true
        whiten_rank: 32

    # E6: Agreement-Gated V2 (6-view, 37-dim agreement, vector gate)
    - head_type: agreement_gated_v2
      params:
        num_latents: 4
        num_attn_heads: 4
        gate_hidden: 128
        gate_rank: 4
        use_mode_prompts: true
        use_confidence_head: true
        dropout: 0.1
