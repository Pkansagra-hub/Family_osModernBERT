# QLoRA Fine-tuning Configuration (4-bit quantized)
defaults:
  - lora

# Override model loading for 4-bit
model:
  load_in_4bit: true
  torch_dtype: bfloat16
  quantization:
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: nf4

# QLoRA specific
peft:
  method: qlora
  
  lora:
    r: 64
    lora_alpha: 16
    lora_dropout: 0.1

# Training overrides
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  optim: paged_adamw_32bit
  learning_rate: 2e-4
  max_grad_norm: 0.3
  warmup_ratio: 0.03
  lr_scheduler_type: constant
