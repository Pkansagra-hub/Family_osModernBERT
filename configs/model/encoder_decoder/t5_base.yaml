# T5 Base Configuration
model:
  type: encoder_decoder
  name_or_path: t5-base
  architecture: t5
  
  # Model parameters
  d_model: 768
  d_kv: 64
  d_ff: 3072
  num_layers: 12
  num_decoder_layers: 12
  num_heads: 12
  relative_attention_num_buckets: 32
  relative_attention_max_distance: 128
  vocab_size: 32128
  
  # Loading options
  load_in_8bit: false
  load_in_4bit: false
  torch_dtype: float32
  trust_remote_code: false
  use_flash_attention_2: false
