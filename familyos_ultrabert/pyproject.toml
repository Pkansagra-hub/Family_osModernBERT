[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-ultrabert"
version = "3.0.2"
description = "FamilyOS UltraBERT v3 - Multi-task NLP with decoder for counterfactual generation"
readme = "README.md"
license = "LicenseRef-Proprietary"
authors = [
    {name = "FamilyOS Team", email = "contact@familyos.dev"}
]
keywords = [
    "nlp", "transformers", "sentiment-analysis", "ner",
    "emotion-detection", "family", "multi-task-learning",
    "safety-classification", "onnx", "pytorch", "ultrabert", "modernbert",
    "counterfactual-generation", "text-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.21.0",
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "huggingface-hub>=0.20.0",
]

[project.scripts]
ultrabert-benchmark = "familyos_ultrabert.benchmarks:main"

[project.optional-dependencies]
pytorch = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
]
onnx = [
    "onnxruntime>=1.16.0",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.16.0",
]
all = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "onnxruntime>=1.16.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Pkansagra-hub/Family_osModernBERT"
Documentation = "https://github.com/Pkansagra-hub/Family_osModernBERT#readme"
Repository = "https://github.com/Pkansagra-hub/Family_osModernBERT"
Issues = "https://github.com/Pkansagra-hub/Family_osModernBERT/issues"

[tool.setuptools]
package-dir = {"familyos_ultrabert" = "."}
packages = [
    "familyos_ultrabert",
    "familyos_ultrabert.benchmarks",
    "familyos_ultrabert.benchmarks.data",
    "familyos_ultrabert.benchmarks.suite",
    "familyos_ultrabert.data",
    "familyos_ultrabert.examples",
    "familyos_ultrabert.models",
]
include-package-data = false

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
