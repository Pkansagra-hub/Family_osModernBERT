[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-studio"
version = "0.1.0"
description = "Unified model training and fine-tuning framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "deep-learning", "transformers", "fine-tuning", "llm"]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
deepspeed = [
    "deepspeed>=0.12.0",
]
unsloth = [
    "unsloth>=2024.1",
]
flash-attn = [
    "flash-attn>=2.4.0",
]
all = [
    "modeling-studio[dev,deepspeed,unsloth,flash-attn]",
]

[project.scripts]
ms-train = "modeling_studio.cli:train"
ms-eval = "modeling_studio.cli:evaluate"

[project.urls]
Homepage = "https://github.com/yourusername/modeling-studio"
Repository = "https://github.com/yourusername/modeling-studio"
Documentation = "https://github.com/yourusername/modeling-studio#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/modeling_studio"
